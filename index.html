<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF8F2">
<title>飲食小本子</title>
<style>
  :root{
    --cream:#FFFAF1; --card:#ffffff; --oat:#FBE4C0; --oatDeep:#E28A2B;
    --matcha:#2E9E62; --matchaSoft:#C9EBD6; --peach:#EE5B7B; --peachSoft:#FCD5DE;
    --sky:#2F86CE; --skySoft:#CDE4F8; --ink:#332C24; --inkSoft:#6F6558; --line:#EADCC4;
    --shadow:0 2px 10px rgba(120,95,55,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--cream); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    font-size:15px; line-height:1.6; min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:460px;margin:0 auto;padding:22px 16px 48px}
  h1{font-size:22px;font-weight:600;margin:0;letter-spacing:.02em}
  .muted{color:var(--inkSoft)}
  .xs{font-size:12px}
  .sm{font-size:13.5px}
  .center{text-align:center}
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
  input{font:inherit;color:inherit}
  input:focus-visible,button:focus-visible{outline:2px solid var(--matcha);outline-offset:2px}
  .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px}
  .row{display:flex;align-items:center}
  .between{justify-content:space-between}
  .gap{gap:8px}
  .stack>*+*{margin-top:14px}
  .icon{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .icon-sm{width:15px;height:15px}
  /* 分頁 */
  .tabs{display:flex;gap:4px;background:var(--oat);border-radius:18px;padding:4px;margin:18px 0}
  .tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 0;border-radius:14px;font-size:13.5px;color:var(--inkSoft);transition:background .18s}
  .tab.on{background:var(--card);color:var(--matcha);font-weight:600;box-shadow:0 1px 6px rgba(120,95,55,.16)}
  /* 圓角小按鈕 */
  .chip{padding:8px 0;border-radius:13px;font-size:13px;background:var(--card);color:var(--inkSoft);flex:1;border:1px solid var(--line);transition:background .18s}
  .chip.on{background:var(--matcha);color:#fff;border-color:var(--matcha)}
  .iconbtn{padding:8px;border-radius:13px;background:var(--oat);color:#8A5A16;display:flex}
  .big{width:100%;padding:14px;border-radius:18px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
  .primary{background:var(--matcha);color:#fff}
  .ghost{background:var(--card);color:var(--inkSoft)}
  .oat{background:var(--oat);color:var(--ink)}
  .field{width:100%;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);outline:none;font-size:14px}
  /* 條目 */
  .entry{width:100%;display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:14px;background:var(--cream);border:1px solid var(--line);text-align:left;margin-top:5px}
  .mealicon{width:29px;height:29px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
  /* 熱度圖 */
  .heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .heat .d{aspect-ratio:1;border-radius:8px;background:var(--cream)}
  .heat .d.has{background:var(--matchaSoft)}
  .heat .d.today{box-shadow:inset 0 0 0 1.5px var(--matcha)}
  /* 面板 */
  .mask{position:fixed;inset:0;background:rgba(92,83,72,.25);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet{width:100%;max-width:460px;background:var(--cream);border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
  .list{max-height:48vh;overflow-y:auto}
  .spin{animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

["甜甜圈","個",260,4,31,14],["布丁","個",150,4,22,5],["豆花","碗",220,6,40,4],["紅豆湯","碗",250,6,52,1],

const FOODS = RAW.map(([n,u,k,p,c,f])=>({n,u,k,p,c,f}));

/* ============ 小工具 ============ */
const WD=['日','一','二','三','四','五','六'];
const pad=n=>String(n).padStart(2,'0');
const toKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>toKey(new Date());
const fromKey=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const shiftKey=(s,n)=>{const d=fromKey(s);d.setDate(d.getDate()+n);return toKey(d);};
const showDate=s=>{const d=fromKey(s);return `${d.getMonth()+1}/${d.getDate()} 週${WD[d.getDay()]}`;};
const md=s=>{const d=fromKey(s);return `${d.getMonth()+1}/${d.getDate()}`;};
const r1=n=>Math.round(n*10)/10;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PORTIONS=[.5,1,1.5,2];

/* ============ 儲存（Claude 環境用 window.storage，一般瀏覽器用 localStorage） ============ */
const mem={};
const S={
  async get(k,fb){
    try{
      if(window.storage){const r=await window.storage.get(k);return r&&r.value?JSON.parse(r.value):fb;}
      const v=localStorage.getItem(k);return v?JSON.parse(v):fb;
    }catch(e){return k in mem?mem[k]:fb;}
  },
  async set(k,v){
    try{
      if(window.storage){await window.storage.set(k,JSON.stringify(v));return;}
      localStorage.setItem(k,JSON.stringify(v));
    }catch(e){mem[k]=v;}
  }
};
const K_E='food-log:entries', K_F='food-log:custom-foods', K_S='food-log:settings', K_W='food-log:weights';

async function probeStorage(){
  try{
    if(window.storage){ await window.storage.set('food-log:probe',1); return true; }
    localStorage.setItem('food-log:probe','1');
    localStorage.removeItem('food-log:probe');
    return true;
  }catch(e){ return false; }
}

/* ============ 狀態 ============ */
const st={entries:[],custom:[],weights:{},goal:null,height:null,weight:null,canSave:true,tab:'today',date:todayKey(),range:7,focus:null,sheet:null,scan:'idle'};

const allFoods=()=>st.custom.concat(FOODS);
const byDate=()=>{const m={};st.entries.forEach(e=>{(m[e.date]=m[e.date]||[]).push(e);});return m;};
const dayOf=d=>st.entries.filter(e=>e.date===d);
const kcalOf=e=>e.k*e.portion;

function streakInfo(){
  const bd=byDate(), t=todayKey();
  let start = bd[t]&&bd[t].length ? t : null;
  if(!start){const y=shiftKey(t,-1); if(bd[y]&&bd[y].length) start=y; else return {n:0,today:false};}
  let n=0,cur=start;
  while(bd[cur]&&bd[cur].length){n++;cur=shiftKey(cur,-1);}
  return {n,today:start===t};
}
function streakText(){
  const s=streakInfo();
  if(s.n===0) return '今天想從哪一餐開始呢 🌿';
  if(s.n===1&&s.today) return '今天也記下來了 🌱';
  return `已經陪伴自己 ${s.n} 天 🌱`;
}

/* ============ 儲存動作 ============ */
const saveE=()=>S.set(K_E,st.entries);
const saveF=()=>S.set(K_F,st.custom);
const saveS=()=>S.set(K_S,{goal:st.goal,height:st.height,weight:st.weight});
const saveW=()=>S.set(K_W,st.weights);

/* BMI */
function bmi(){
  if(!st.height||!st.weight) return null;
  const h=st.height/100;
  return Math.round(st.weight/(h*h)*10)/10;
}
const BMI_BANDS=[
  {max:18.5, name:'過輕', color:'#CDE4F8'},
  {max:24,   name:'健康', color:'#C9EBD6'},
  {max:27,   name:'過重', color:'#FBE4C0'},
  {max:99,   name:'肥胖', color:'#FCD5DE'},
];
const bandOf=v=>BMI_BANDS.find(b=>v<b.max)||BMI_BANDS[3];

function addEntries(items,meal,date){
  const d=date||st.date, now=Date.now();
  const photo = (pendingPhoto && items.length===1) ? pendingPhoto.photo : null;
  items.forEach((it,i)=>st.entries.push({
    id:now+'-'+i+'-'+Math.random().toString(36).slice(2,6),
    date:d, meal, name:it.food.n, unit:it.food.u, portion:it.portion,
    k:it.food.k, p:it.food.p, c:it.food.c, f:it.food.f,
    ...(photo?{photo}:{})
  }));
  pendingPhoto=null;
  saveE(); st.sheet=null; render();
}

/* ============ SVG 圖表 ============ */
function seriesData(){
  const bd=byDate(), out=[];
  for(let i=st.range-1;i>=0;i--){
    const key=shiftKey(todayKey(),-i);
    const rows=bd[key]||[];
    const row={key,label:md(key),total:0};
    MEALS.forEach(m=>row[m.k]=0);
    rows.forEach(e=>{row.total+=kcalOf(e);row[e.meal]+=kcalOf(e);});
    row.total=Math.round(row.total);
    MEALS.forEach(m=>row[m.k]=Math.round(row[m.k]));
    out.push(row);
  }
  return out;
}

function lineChart(data){
  const W=320,H=160,L=36,R=8,T=12,B=24;
  const pw=W-L-R, ph=H-T-B;
  const vals=data.map(d=>d.total);
  const top=Math.max(600, Math.ceil((Math.max(...vals, st.goal||0)*1.15)/200)*200);
  const x=i=>L+(data.length===1?pw/2:pw*i/(data.length-1));
  const y=v=>T+ph-ph*v/top;
  let grid='',ticks=4;
  for(let i=0;i<=ticks;i++){
    const v=top*i/ticks, yy=y(v);
    grid+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;
    grid+=`<text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="9" fill="var(--inkSoft)">${Math.round(v)}</text>`;
  }
  const path=data.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(d.total).toFixed(1)}`).join(' ');
  const area=`M${x(0)} ${y(0)} `+data.map((d,i)=>`L${x(i).toFixed(1)} ${y(d.total).toFixed(1)}`).join(' ')+` L${x(data.length-1)} ${y(0)} Z`;
  const dots=data.map((d,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(d.total).toFixed(1)}" r="${st.focus===d.key?4.5:3}" fill="#fff" stroke="var(--matcha)" stroke-width="2"/>`).join('');
  const step=Math.ceil(data.length/5);
  const labels=data.map((d,i)=>(i%step===0||i===data.length-1)?`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--inkSoft)">${d.label}</text>`:'').join('');
  const hits=data.map((d,i)=>`<rect data-act="focus" data-key="${d.key}" x="${(x(i)-pw/data.length/2).toFixed(1)}" y="${T}" width="${(pw/data.length).toFixed(1)}" height="${ph}" fill="transparent"/>`).join('');
  const goalLine=st.goal?`<line x1="${L}" y1="${y(st.goal).toFixed(1)}" x2="${W-R}" y2="${y(st.goal).toFixed(1)}" stroke="var(--peach)" stroke-width="1.6" stroke-dasharray="5 5"/>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}
    <path d="${area}" fill="var(--matchaSoft)" opacity=".55"/>
    ${goalLine}
    <path d="${path}" fill="none" stroke="var(--matcha)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${labels}${hits}</svg>`;
}

function barChart(data){
  const W=320,H=160,L=36,R=8,T=12,B=24;
  const pw=W-L-R, ph=H-T-B;
  const top=Math.max(600, Math.ceil(Math.max(...data.map(d=>d.total))*1.15/200)*200);
  const slot=pw/data.length, bw=Math.min(18,slot*.62);
  let grid='';
  for(let i=0;i<=4;i++){
    const v=top*i/4, yy=T+ph-ph*v/top;
    grid+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;
    grid+=`<text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="9" fill="var(--inkSoft)">${Math.round(v)}</text>`;
  }
  let bars='';
  data.forEach((d,i)=>{
    const cx=L+slot*i+slot/2; let acc=0;
    MEALS.forEach(m=>{
      const v=d[m.k]; if(!v) return;
      const h=ph*v/top, yy=T+ph-ph*acc/top-h;
      bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" fill="${m.color}" rx="2"/>`;
      acc+=v;
    });
    bars+=`<rect data-act="focus" data-key="${d.key}" x="${(cx-slot/2).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ph}" fill="transparent"/>`;
  });
  const step=Math.ceil(data.length/5);
  const labels=data.map((d,i)=>(i%step===0||i===data.length-1)?`<text x="${(L+slot*i+slot/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--inkSoft)">${d.label}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}${bars}${labels}</svg>`;
}

function donut(mac){
  const tot=mac.reduce((s,m)=>s+m.v,0);
  if(!tot) return '';
  const R=42, CIRC=2*Math.PI*R; let off=0;
  const arcs=mac.map(m=>{
    const len=CIRC*m.v/tot;
    const el=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${m.color}" stroke-width="17"
      stroke-dasharray="${Math.max(len-3,0).toFixed(1)} ${(CIRC-len+3).toFixed(1)}"
      stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 60 60)" stroke-linecap="round"/>`;
    off+=len; return el;
  }).join('');
  return `<svg viewBox="0 0 120 120" width="150" height="150" style="display:block;margin:0 auto">${arcs}
    <text x="60" y="58" text-anchor="middle" font-size="15" fill="var(--ink)">${Math.round(tot)}</text>
    <text x="60" y="72" text-anchor="middle" font-size="9" fill="var(--inkSoft)">kcal</text></svg>`;
}

function weightChart(){
  const days=[]; for(let i=st.range-1;i>=0;i--) days.push(shiftKey(todayKey(),-i));
  const pts=days.map((k,i)=>({i,k,v:st.weights[k]})).filter(p=>typeof p.v==='number');
  if(pts.length<2) return `<p class="sm muted center" style="padding:26px 0;margin:0">
    記錄兩天以上就會畫出曲線 🌿</p>`;
  const W=320,H=150,L=38,R=8,T=12,B=24, pw=W-L-R, ph=H-T-B;
  const vs=pts.map(p=>p.v);
  let lo=Math.min(...vs), hi=Math.max(...vs);
  if(hi-lo<2){const mid=(hi+lo)/2; lo=mid-1; hi=mid+1;}
  lo-=(hi-lo)*.15; hi+=(hi-lo)*.12;
  const x=i=>L+(days.length===1?pw/2:pw*i/(days.length-1));
  const y=v=>T+ph-ph*(v-lo)/(hi-lo);
  let grid='';
  for(let i=0;i<=3;i++){
    const v=lo+(hi-lo)*i/3, yy=y(v);
    grid+=`<line x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    grid+=`<text x="${L-6}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--inkSoft)">${v.toFixed(1)}</text>`;
  }
  const path=pts.map((p,j)=>`${j?'L':'M'}${x(p.i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const dots=pts.map(p=>`<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.2" fill="#fff" stroke="var(--sky)" stroke-width="2"/>`).join('');
  const step=Math.ceil(days.length/5);
  const labels=days.map((k,i)=>(i%step===0||i===days.length-1)?`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--inkSoft)">${md(k)}</text>`:'').join('');
  const first=pts[0].v, last=pts[pts.length-1].v, d=Math.round((last-first)*10)/10;
  const note=`這段期間 ${d>0?'+':''}${d} kg`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}
    <path d="${path}" fill="none" stroke="var(--sky)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${labels}</svg>
    <p class="xs muted center" style="margin:8px 0 0">${note}</p>`;
}

      </div>

        diff>0?`比目標多了 ${diff} kcal，身體有它自己的節奏 🌿`:`距離目標還有 ${Math.abs(diff)} kcal`}</p>`:''}

function heatmap(){
  const bd=byDate(), t=new Date(), start=new Date(t); start.setDate(start.getDate()-34);
  let cells='';
  for(let i=0;i<start.getDay();i++) cells+='<div></div>';
  for(let i=0;i<35;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    if(d>t) break;
    const k=toKey(d);
    cells+=`<div class="d ${bd[k]&&bd[k].length?'has':''} ${k===todayKey()?'today':''}"></div>`;
  }
  return `<div class="card">
    <p class="xs muted" style="margin:0 0 10px">最近一個月</p>
    <div class="heat">${WD.map(w=>`<div class="xs muted center">${w}</div>`).join('')}${cells}</div>
  </div>`;
}

        ${MEALS.map(m=>`<span class="row" style="gap:5px"><span style="width:8px;height:8px;border-radius:99px;background:${m.color};display:inline-block"></span>${m.label}</span>`).join('')}

}

      body=`
        <p class="sm muted center" style="padding:10px 0 20px">
          掃到條碼了，但資料庫裡還沒有這個商品 🌿
        </p>
        <button class="big primary" data-act="photoFallback" data-v="${s.meal}">${ic('camera','icon-sm')}拍張照片留個提醒</button>
        <button class="big ghost" style="margin-top:10px" data-act="pick" data-v="${s.meal}">改用手動搜尋</button>`;
    } else if(s.stage==='unsupported'){
      body=`
        <p class="sm muted center" style="padding:10px 0 20px">
          這個瀏覽器還不支援鏡頭掃描，可以直接輸入條碼數字，或改用手動搜尋。
        </p>
        <div class="row gap" style="margin-bottom:10px">
          <input class="field" id="manualCode" type="text" inputmode="numeric" placeholder="輸入條碼數字">
          <button class="chip on" style="flex:0 0 auto;padding:10px 16px" data-act="manualLookup" data-v="${s.meal}">查詢</button>
        </div>
        <button class="big ghost" data-act="pick" data-v="${s.meal}">改用手動搜尋</button>`;
    } else {
      body=`
        <div id="scanBox" style="border-radius:16px;overflow:hidden;background:#000;position:relative;aspect-ratio:4/3">
        </div>
        <p class="xs muted center" style="margin:10px 0 0">把條碼對準框內，等它自己抓到就好</p>
        <div class="row gap" style="margin-top:14px">
          <input class="field" id="manualCode" type="text" inputmode="numeric" placeholder="或直接輸入條碼數字">
          <button class="chip on" style="flex:0 0 auto;padding:10px 16px" data-act="manualLookup" data-v="${s.meal}">查詢</button>
        </div>`;
    }
  }
  else if(s.type==='confirm'){
    title='看看認得對不對';
    body=`
      <div class="row gap" style="margin-bottom:12px">
        ${MEALS.map(m=>`<button class="chip ${s.meal===m.k?'on':''}" data-act="cMeal" data-v="${m.k}">${m.label}</button>`).join('')}
      </div>
      ${s.items.map((it,i)=>`
        <div class="card" style="padding:12px;margin-bottom:10px">
          <div class="row between" style="margin-bottom:8px">
            <span class="sm">${esc(it.food.n)}</span>
            <div class="row gap">
              <span class="xs muted">${Math.round(it.food.k*it.portion)} kcal</span>
              <button class="muted" data-act="cDel" data-v="${i}" aria-label="移除">${ic('x','icon-sm')}</button>
            </div>
          </div>
          <div class="row gap">${PORTIONS.map(p=>`<button class="chip ${it.portion===p?'on':''}" data-act="cPort" data-v="${i}:${p}">${p} ${esc(it.food.u)}</button>`).join('')}</div>
        </div>`).join('')}
      ${s.items.length?`
        <p class="sm center" style="margin:0 0 12px">共 ${Math.round(s.items.reduce((x,it)=>x+it.food.k*it.portion,0))} kcal</p>
        <button class="big primary" data-act="cSave">${ic('check','icon-sm')}全部加入</button>`
      :'<p class="sm muted center" style="padding:20px 0">都移除了，再拍一次也可以 🌿</p>'}
      <p class="xs muted center" style="margin:12px 0 0">熱量取自內建清單，份量可以自己調整</p>`;
  }
  else if(s.type==='edit'){
    const e=st.entries.find(x=>x.id===s.id); if(!e){st.sheet=null;return renderSheet();}
    title=e.name;
    body=`
      ${e.photo?`<div class="row between card" style="padding:10px 12px;margin-bottom:14px">
        <span class="row gap"><img src="${e.photo}" style="width:40px;height:40px;border-radius:12px;object-fit:cover">
        <span class="xs muted">附上的提醒照片</span></span>
        <button class="muted" data-act="eDelPhoto" aria-label="刪除照片">${ic('trash','icon-sm')}</button>
      </div>`:''}
      <p class="xs muted" style="margin:0 0 8px">放在哪一餐</p>
      <div class="row gap" style="margin-bottom:14px">
        ${MEALS.map(m=>`<button class="chip ${s.meal===m.k?'on':''}" data-act="eMeal" data-v="${m.k}">${m.label}</button>`).join('')}
      </div>
      <p class="xs muted" style="margin:0 0 8px">吃了多少</p>
      <div class="row gap">${PORTIONS.map(p=>`<button class="chip ${s.portion===p?'on':''}" data-act="ePort" data-v="${p}">${p} ${esc(e.unit)}</button>`).join('')}</div>
      <p class="sm center" style="margin:14px 0">共 ${Math.round(e.k*s.portion)} kcal</p>
      <button class="big primary" data-act="eSave">儲存變更</button>
      <button class="big ghost" style="margin-top:10px" data-act="eDel">${ic('trash','icon-sm')}刪除這筆</button>`;
  }
  else if(s.type==='custom'){
    title='新增自訂食物';
    const fld=(l,id,ph,num)=>`<div style="margin-bottom:10px"><p class="xs muted" style="margin:0 0 4px">${l}</p>
      <input class="field" id="${id}" ${num?'type="number" inputmode="decimal"':''} placeholder="${ph}"></div>`;
    body=`${fld('名稱','cf_n','例如 阿姨的滷味')}${fld('單位','cf_u','碗／份／片／杯')}${fld('熱量 kcal','cf_k','每一單位的熱量',1)}
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        ${fld('蛋白質 g','cf_p','0',1)}${fld('碳水 g','cf_c','0',1)}${fld('脂肪 g','cf_f','0',1)}
      </div>
      <button class="big primary" data-act="cfSave">存進我的清單</button>
      <p class="xs muted center" style="margin:12px 0 0">營養素可以留白，只填熱量也沒問題</p>`;
  }

  el.innerHTML=`<div class="mask" data-act="close"><div class="sheet" data-stop="1">
    <div class="row between" style="margin-bottom:14px">
      <p class="sm" style="margin:0">${esc(title)}</p>
      <button class="muted" data-act="close" aria-label="關閉">${ic('x','icon-sm')}</button>
    </div>${body}</div></div>`;

  const q=document.getElementById('q');
  if(q){
    q.focus();
    q.addEventListener('input',()=>{st.sheet.q=q.value;document.getElementById('results').innerHTML=resultsHtml(q.value);});
  }
  if(document.getElementById('scanBox')) startScan(s.meal);
}

function resultsHtml(q){
  const s=q.trim(), list=allFoods();
  let res;
  if(!s) res=list.slice(0,30);
  else{
    const cs=[...s];
    res=list.filter(f=>{
      if(f.n.includes(s)) return true;
      let i=0; for(const ch of f.n){ if(ch===cs[i]) i++; if(i===cs.length) return true; }
      return false;
    }).slice(0,40);
  }
  if(!res.length) return '<p class="sm muted center" style="padding:28px 0">清單裡還沒有這個，加進自訂食物吧 🌿</p>';
  return res.map(f=>`<button class="entry" style="background:var(--card)" data-act="sel" data-v="${esc(f.n)}">
    <span class="sm">${esc(f.n)}${f.custom?'<span class="xs" style="color:var(--matcha);margin-left:8px">自訂</span>':''}</span>
    <span class="xs muted">${f.k} kcal / ${esc(f.u)}</span></button>`).join('');
}

function pickConfirm(s){
  const f=s.sel;
  return `<div class="card center" style="margin-bottom:14px">
      <p style="font-size:16px;margin:0">${esc(f.n)}</p>
      <p class="xs muted" style="margin:4px 0 0">${f.k} kcal / ${esc(f.u)}　蛋白 ${f.p}g・碳水 ${f.c}g・脂肪 ${f.f}g</p>
    </div>
    <p class="xs muted" style="margin:0 0 8px">吃了多少</p>
    <div class="row gap">${PORTIONS.map(p=>`<button class="chip ${s.portion===p?'on':''}" data-act="pPort" data-v="${p}">${p} ${esc(f.u)}</button>`).join('')}</div>
    <p class="sm center" style="margin:14px 0">共 ${Math.round(f.k*s.portion)} kcal</p>
    <div class="row gap">
      <button class="big ghost" data-act="pBack">換一個</button>
      <button class="big primary" data-act="pSave">${ic('check','icon-sm')}加入紀錄</button>
    </div>`;
}

/* ============ 條碼掃描 ============ */
const picker=document.getElementById('picker');
let quaggaOn=false, pendingPhoto=null;

function stopScan(){
  if(quaggaOn){ try{ Quagga.offDetected(); Quagga.stop(); }catch(e){} quaggaOn=false; }
}

function startScan(meal){
  stopScan();
  const box=document.getElementById('scanBox');
  if(!box || typeof Quagga==='undefined'){
    st.sheet={type:'scan',meal,stage:'unsupported'}; return renderSheet();
  }
  Quagga.init({
    inputStream:{ name:'Live', type:'LiveStream', target:box, constraints:{ facingMode:'environment' } },
    decoder:{ readers:['ean_reader','ean_8_reader','upc_reader','upc_e_reader'] },
    locate:true
  }, err=>{
    if(err){ st.sheet={type:'scan',meal,stage:'unsupported'}; return renderSheet(); }
    quaggaOn=true; Quagga.start();
  });
  Quagga.onDetected(data=>{
    const code=data && data.codeResult && data.codeResult.code;
    if(!code) return;
    stopScan();
    lookupBarcode(code, meal);
  });
}

async function lookupBarcode(code, meal){
  st.sheet={type:'scan',meal,stage:'loading'}; renderSheet();
  try{
    const resp=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_zh,nutriments`);
    const data=await resp.json();
    const prod=data && data.product;
    const nut=(prod && prod.nutriments) || {};
    const kcal=typeof nut['energy-kcal_100g']==='number'?nut['energy-kcal_100g']:null;
    if(data.status!==1 || !prod || kcal===null){
      st.sheet={type:'scan',meal,stage:'notfound'}; return renderSheet();
    }
    const name=prod.product_name_zh || prod.product_name || '這個商品';
    st.sheet={type:'scan',meal,stage:'found',grams:100,product:{
      n:name, k:Math.round(kcal), p:r1(nut.proteins_100g||0), c:r1(nut.carbohydrates_100g||0), f:r1(nut.fat_100g||0)
    }};
    renderSheet();
  }catch(e){
    st.sheet={type:'scan',meal,stage:'notfound'}; renderSheet();
  }
}

function compressPhoto(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=320;
      const scale=Math.min(1, max/Math.max(img.width,img.height));
      const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg',0.6));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src=url;
  });
}

picker.addEventListener('change',async ()=>{
  const file=picker.files&&picker.files[0]; picker.value='';
  if(!file) return;
  const meal=pendingPhoto&&pendingPhoto.meal;
  try{ pendingPhoto={meal, photo:await compressPhoto(file)}; }
  catch(e){ pendingPhoto=null; }
  st.sheet={type:'pick',meal,q:'',sel:null,portion:1};
  renderSheet();
});

/* ============ 事件 ============ */
document.addEventListener('click',ev=>{
  const stopEl=ev.target.closest('[data-stop]');
  const t=ev.target.closest('[data-act]');
  if(!t) return;
  if(stopEl && !stopEl.contains(t)) return;
  const a=t.dataset.act, v=t.dataset.v;
  const s=st.sheet;

  switch(a){
    case 'tab': st.tab=v; st.focus=null; return render();
    case 'day': st.date=shiftKey(st.date,Number(v)); return render();
    case 'today': st.date=todayKey(); return render();
    case 'range': st.range=Number(v); st.focus=null; return render();
    case 'focus': st.focus=st.focus===v?null:v; return render();
    case 'close': stopScan(); pendingPhoto=null; st.sheet=null; return renderSheet();

    case 'pick': stopScan(); pendingPhoto=null; st.sheet={type:'pick',meal:v,q:'',sel:null,portion:1}; return renderSheet();
    case 'scan': st.sheet={type:'scan',meal:v}; return renderSheet();
    case 'manualLookup': {
      stopScan();
      const code=document.getElementById('manualCode').value.trim();
      if(!code){ alert('先輸入條碼上的數字'); return; }
      return lookupBarcode(code, v);
    }
    case 'scanSave': {
      const grams=Number(document.getElementById('gramIn').value);
      if(!grams || grams<=0){ alert('公克數要大於 0 喔'); return; }
      const p=s.product;
      const food={n:p.n, u:'公克', k:r1(p.k/100), p:r1(p.p/100), c:r1(p.c/100), f:r1(p.f/100)};
      return addEntries([{food,portion:grams}], s.meal);
    }
    case 'photoFallback': pendingPhoto={meal:v}; return picker.click();

    case 'sel': s.sel=allFoods().find(f=>f.n===v); s.portion=1; return renderSheet();
    case 'pPort': s.portion=Number(v); return renderSheet();
    case 'pBack': s.sel=null; return renderSheet();
    case 'pSave': return addEntries([{food:s.sel,portion:s.portion}],s.meal);

    case 'cMeal': s.meal=v; return renderSheet();
    case 'cDel': s.items.splice(Number(v),1); return renderSheet();
    case 'cPort': {const[i,p]=v.split(':'); s.items[Number(i)].portion=Number(p); return renderSheet();}
    case 'cSave': return addEntries(s.items,s.meal);

    case 'edit': {const e=st.entries.find(x=>x.id===v); st.sheet={type:'edit',id:v,meal:e.meal,portion:e.portion}; return renderSheet();}
    case 'eMeal': s.meal=v; return renderSheet();
    case 'ePort': s.portion=Number(v); return renderSheet();
    case 'eSave': {
      const e=st.entries.find(x=>x.id===s.id);
      e.meal=s.meal; e.portion=s.portion; saveE(); st.sheet=null; return render();
    }
    case 'eDel': st.entries=st.entries.filter(x=>x.id!==s.id); saveE(); st.sheet=null; return render();
    case 'eDelPhoto': {
      const e=st.entries.find(x=>x.id===s.id);
      delete e.photo; saveE(); return renderSheet();
    }

    case 'custom': st.sheet={type:'custom',meal:s&&s.meal}; return renderSheet();
    case 'cfSave': {
      const g=id=>document.getElementById(id).value.trim();
      const n=g('cf_n'), k=Number(g('cf_k'));
      if(!n||!k){alert('名稱和熱量填一下就可以了');return;}
      const food={n,u:g('cf_u')||'份',k,p:Number(g('cf_p'))||0,c:Number(g('cf_c'))||0,f:Number(g('cf_f'))||0,custom:true};
      st.custom=[food].concat(st.custom.filter(x=>x.n!==n)); saveF();
      if(s.meal) return addEntries([{food,portion:1}],s.meal);
      st.sheet=null; return render();
    }
    case 'delCustom': st.custom=st.custom.filter(f=>f.n!==v); saveF(); return render();
    case 'saveGoal': {
      const val=document.getElementById('goalIn').value.trim();
      st.goal = val===''?null:Number(val); saveS(); return render();
    }
    case 'saveBody': {
      const h=document.getElementById('hIn').value.trim();
      const w=document.getElementById('wIn').value.trim();
      st.height = h===''?null:Number(h);
      st.weight = w===''?null:Number(w);
      if(st.weight) { st.weights[todayKey()]=st.weight; saveW(); }
      saveS(); return render();
    }
  }
});

/* ============ 啟動 ============ */
(async function(){
  st.canSave = await probeStorage();
  st.entries = await S.get(K_E,[]) || [];
  st.custom  = await S.get(K_F,[]) || [];
  const set  = await S.get(K_S,{}) || {};
  st.goal = typeof set.goal==='number'?set.goal:null;
  st.height = typeof set.height==='number'?set.height:null;
  st.weight = typeof set.weight==='number'?set.weight:null;
  st.weights = await S.get(K_W,{}) || {};
  render();
})();
</script>
